[project]
name = "traffic-anomaly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Navit", email = "navitjob@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "geopandas>=1.1.4",
    "polars>=1.43.2",
    "pydeck>=0.9.3",
    "pyod>=3.6.5",
    "requests>=2.32.0",
    "ruptures>=1.1.10",
    "statsmodels>=0.14.6",
    "streamlit>=1.61.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
